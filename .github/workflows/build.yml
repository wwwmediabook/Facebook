name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Android project
        run: |
          set -e
          mkdir -p proj && cd proj
          mkdir -p .
          cat > settings.gradle <<'FBEOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "FriendsBook"
          include ':app'
          FBEOF
          mkdir -p .
          cat > build.gradle <<'FBEOF'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          FBEOF
          mkdir -p .
          cat > gradle.properties <<'FBEOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          FBEOF
          mkdir -p app
          cat > app/build.gradle <<'FBEOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.friendsbook.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.friendsbook.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
          }
          FBEOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'FBEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-feature android:name="android.hardware.camera" android:required="false"/>
              <uses-feature android:name="android.hardware.microphone" android:required="false"/>
              <application android:label="@string/app_name" android:icon="@drawable/ic_launcher" android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false" android:allowBackup="true" android:hardwareAccelerated="true">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          FBEOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'FBEOF'
          <resources><string name="app_name">Friends Book</string></resources>
          FBEOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml <<'FBEOF'
          <resources>
              <style name="AppTheme" parent="android:Theme.DeviceDefault.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/white</item>
                  <item name="android:statusBarColor">#6c4cf1</item>
              </style>
          </resources>
          FBEOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'FBEOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#6c4cf1" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M36,28h40v12h-27v13h23v12h-23v25h-13z"/>
          </vector>
          FBEOF
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/offline.html <<'FBEOF'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:sans-serif;text-align:center;padding:30vh 20px;background:#f0f2f8}h1{color:#6c4cf1}button{background:#6c4cf1;color:#fff;border:0;border-radius:12px;padding:12px 28px;font-size:16px}</style></head>
          <body><h1>Friends Book</h1><p>ইন্টারনেট সংযোগ নেই। সংযোগ চেক করে আবার চেষ্টা করুন।</p><button onclick="location.href='https://friendsbook.site.je/'">আবার চেষ্টা করুন</button></body></html>
          FBEOF
          mkdir -p app/src/main/java/com/friendsbook/app
          cat > app/src/main/java/com/friendsbook/app/MainActivity.java <<'FBEOF'
          package com.friendsbook.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {
              // আপনার ওয়েবসাইটের ঠিকানা বদলাতে হলে শুধু এই দুই লাইন বদলান (HTTPS হতে হবে)
              static final String HOME = "https://friendsbook.site.je/";
              static final String HOST = "friendsbook.site.je";

              WebView web;
              FrameLayout root;
              ValueCallback<Uri[]> fileCb;
              PermissionRequest pendingReq;
              View customView;
              WebChromeClient.CustomViewCallback customCb;

              @Override
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  if (Build.VERSION.SDK_INT >= 21) getWindow().setStatusBarColor(Color.parseColor("#6c4cf1"));
                  root = new FrameLayout(this);
                  web = new WebView(this);
                  root.addView(web, new FrameLayout.LayoutParams(-1, -1));
                  setContentView(root);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setUserAgentString(s.getUserAgentString() + " FriendsBookApp/1.0");
                  CookieManager.getInstance().setAcceptCookie(true);

                  web.setDownloadListener((url, ua, cd, mime, len) -> {
                      try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); } catch (Exception e) { }
                  });

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if (HOST.equals(u.getHost()) || "file".equals(u.getScheme())) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) { }
                          return true;
                      }
                      @Override
                      public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                          if (r.isForMainFrame()) v.loadUrl("file:///android_asset/offline.html");
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest req) {
                          runOnUiThread(new Runnable() { public void run() { handlePerm(req); } });
                      }
                      @Override
                      public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (fileCb != null) fileCb.onReceiveValue(null);
                          fileCb = cb;
                          try { startActivityForResult(p.createIntent(), 200); }
                          catch (Exception e) { fileCb = null; return false; }
                          return true;
                      }
                      @Override
                      public void onShowCustomView(View v, CustomViewCallback cb) {
                          if (customView != null) { cb.onCustomViewHidden(); return; }
                          customView = v; customCb = cb;
                          web.setVisibility(View.GONE);
                          root.addView(v);
                      }
                      @Override
                      public void onHideCustomView() {
                          if (customView == null) return;
                          root.removeView(customView);
                          customView = null;
                          web.setVisibility(View.VISIBLE);
                          if (customCb != null) customCb.onCustomViewHidden();
                      }
                  });

                  if (saved != null) web.restoreState(saved); else web.loadUrl(HOME);
              }

              void handlePerm(PermissionRequest req) {
                  List<String> missing = new ArrayList<>();
                  if (Build.VERSION.SDK_INT >= 23) {
                      for (String r : req.getResources()) {
                          String p = null;
                          if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(r)) p = Manifest.permission.CAMERA;
                          if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(r)) p = Manifest.permission.RECORD_AUDIO;
                          if (p != null && checkSelfPermission(p) != PackageManager.PERMISSION_GRANTED) missing.add(p);
                      }
                  }
                  if (missing.isEmpty()) { req.grant(req.getResources()); }
                  else { pendingReq = req; requestPermissions(missing.toArray(new String[0]), 100); }
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] res) {
                  if (code == 100 && pendingReq != null) {
                      boolean ok = res.length > 0;
                      for (int x : res) if (x != PackageManager.PERMISSION_GRANTED) ok = false;
                      if (ok) pendingReq.grant(pendingReq.getResources()); else pendingReq.deny();
                      pendingReq = null;
                  }
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == 200 && fileCb != null) {
                      fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                      fileCb = null;
                  } else super.onActivityResult(req, res, data);
              }

              @Override
              public void onBackPressed() {
                  if (customView != null) { web.getWebChromeClient().onHideCustomView(); }
                  else if (web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }

              @Override protected void onSaveInstanceState(Bundle out) { super.onSaveInstanceState(out); web.saveState(out); }
              @Override protected void onPause() { super.onPause(); }
              @Override protected void onResume() { super.onResume(); web.onResume(); }
              @Override protected void onDestroy() { web.destroy(); super.onDestroy(); }
          }
          FBEOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FriendsBook-APK
          path: proj/app/build/outputs/apk/debug/*.apk
